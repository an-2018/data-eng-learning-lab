projects:
- id: workforce
  number: 1
  title: Workforce and project knowledge graph
  description: Connect people, organizations, and assignments with a model whose meaning
    you can defend.
  hours: 8
  status: authored
  brief: Produce a versioned project bundle with your implementation, fixtures, and
    a short decision record. Use the module workspaces to test each artifact. Milestone
    notes record self-review evidence; they are not an automated certification of
    the entire project.
  rubric:
  - The model answers every stated competency question.
  - Identity, lifecycle, and uncertainty are explicit.
  - Positive and negative cases are tested.
  - Results and source evidence can be reproduced.
  - Tradeoffs and remaining limitations are explained.
  milestones:
  - id: questions
    title: Competency questions
    description: Write six queries the model must support. Include multiple assignments
      and missing contact details.
  - id: model
    title: Identity and ontology
    description: Create ontology.ttl and data.ttl with Person, Company, Client, Project,
      and Assignment. Explain stable identifiers and lifecycle.
  - id: validation
    title: Queries, shapes, and reasoning
    description: Add executable query examples, positive and negative SHACL fixtures,
      and intended/unintended OWL entailment checks.
  - id: review
    title: Explain the model
    description: Document alternatives, limits, and the effect of incomplete data.
      Export the ontology for an optional Protégé review.
  sources:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id007
- id: commerce
  number: 2
  title: Commerce integration
  description: Reconcile two catalogs and order feeds while retaining the evidence
    behind every mapping.
  hours: 12
  status: authored
  brief: Produce a versioned project bundle with your implementation, fixtures, and
    a short decision record. Use the module workspaces to test each artifact. Milestone
    notes record self-review evidence; they are not an automated certification of
    the entire project.
  rubric:
  - The model answers every stated competency question.
  - Identity, lifecycle, and uncertainty are explicit.
  - Positive and negative cases are tested.
  - Results and source evidence can be reproduced.
  - Tradeoffs and remaining limitations are explained.
  milestones:
  - id: sources
    title: Source contracts
    description: Create two fixtures with conflicting product names, reused emails,
      categories, and order-line identifiers.
  - id: mapping
    title: Mappings and identity
    description: Define stable order and order-line IRIs. Preserve source fields and
      explain Brand versus Category modeling.
  - id: resolution
    title: Resolution and quarantine
    description: Create deterministic rules, confidence bands, and a review queue.
      Record false-merge examples and rejected records.
  - id: provenance
    title: Reconciliation and evidence
    description: Link canonical facts to source snapshots and mapping activities.
      Write reconciliation queries and demonstrate reversing a bad match.
  sources:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id007
- id: publication
  number: 3
  title: Reliable knowledge-graph publication
  description: Publish a validated snapshot, recover from failure, and explain query
    performance with evidence.
  hours: 12
  status: authored
  brief: Produce a versioned project bundle with your implementation, fixtures, and
    a short decision record. Use the module workspaces to test each artifact. Milestone
    notes record self-review evidence; they are not an automated certification of
    the entire project.
  rubric:
  - The model answers every stated competency question.
  - Identity, lifecycle, and uncertainty are explicit.
  - Positive and negative cases are tested.
  - Results and source evidence can be reproduced.
  - Tradeoffs and remaining limitations are explained.
  milestones:
  - id: snapshot
    title: Reproducible snapshot
    description: Record source bytes, versioned mappings, stable identifiers, and
      expected input/output counts.
  - id: pipeline
    title: Stage, validate, and publish
    description: Implement staging and quarantine. Promote the complete graph in one
      dataset transaction.
  - id: recovery
    title: Failure and recovery
    description: Inject a failure before commit and an ambiguous response after commit.
      Demonstrate idempotent retries and restoration.
  - id: performance
    title: Performance and release evidence
    description: Compare equivalent queries with controlled measurements. Record engine
      version, statistics, limits, and rollback instructions.
  sources:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id007
