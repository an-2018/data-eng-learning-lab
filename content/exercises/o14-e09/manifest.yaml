minutes: 20
objectives:
- 'Implement this SPARQL Update transformation: checkpoint: retry-safe normalization.'
prerequisites:
- o14-e01
statement: 'Implement this SPARQL Update transformation: checkpoint: retry-safe normalization.


  The verification query is:

  ```sparql

  PREFIX ex: <https://example.org/>

  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

  SELECT ?s ?name ?id WHERE { GRAPH ex:published { ?s ex:name ?name ; ex:employeeId
  ?id } }

  ```


  Publish name from rawName together with employeeId for every subject that has both.
  The runner repeats the transaction; the first attempt is rolled back to test recovery.'
requirements:
- Implement the behavior described above for every fixture.
- Use the exact output variable names or file contract shown in the task.
- Preserve identity, datatypes, and duplicate rows unless the task explicitly requests
  a change.
starter:
  update.rq: 'PREFIX ex: <https://example.org/>

    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>


    # Write a complete query here.

    '
solution:
  update.rq: 'PREFIX ex: <https://example.org/>

    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    INSERT { GRAPH ex:published { ?s ex:name ?name ; ex:employeeId ?id } } WHERE {
    ?s ex:rawName ?name ; ex:employeeId ?id }'
explanation: Use explicit named graphs and stable subject identifiers. The transaction
  controls commit versus abort; your update must be safe when repeated.
hints:
- Start with the entity or output grain requested by the question.
- Use explicit named graphs and stable subject identifiers. The transaction controls
  commit versus abort; your update must be safe when repeated.
- Use the public dataset to trace one result from its inputs. Then consider missing
  values and repeated matches.
