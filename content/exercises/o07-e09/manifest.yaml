    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

    @prefix sh: <http://www.w3.org/ns/shacl#> .

    ex:Person a owl:Class . ex:Employee a owl:Class . ex:Company a owl:Class . ex:Engineer
    a owl:Class . ex:Impossible a owl:Class . ex:worksFor a owl:ObjectProperty . ex:employs
    a owl:ObjectProperty . ex:ava a owl:NamedIndividual . ex:northstar a owl:NamedIndividual
    .

    ex:Employee rdfs:subClassOf ex:Person .'
explanation: Subclass axioms state necessary conditions. Equivalence states both directions.
  Missing facts and unsatisfiable classes must be distinguished from inconsistent
  ontologies.
