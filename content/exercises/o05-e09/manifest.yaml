id: o05-e09
title: 'Checkpoint: unique client contributors'
module_id: o05
version: 1.0.0
dataset_version: '1'
grader_version: '1'
runtime_version: '1'
difficulty: Intermediate
mode: assessment
runner: sparql
minutes: 20
objectives:
- Return ?client and ?people, counting distinct people assigned to that client projects.
prerequisites:
- o05-e01
statement: 'Return ?client and ?people, counting distinct people assigned to that
  client projects.


  The dataset contains Person, Company, Project, and Assignment resources. All example
  IRIs use https://example.org/.'
requirements:
- Implement the behavior described above for every fixture.
- Use the exact output variable names or file contract shown in the task.
- Preserve identity, datatypes, and duplicate rows unless the task explicitly requests
  a change.
starter:
  query.rq: 'PREFIX ex: <https://example.org/>

    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>


    # Write a complete query here.

    '
solution:
  query.rq: 'PREFIX ex: <https://example.org/>

    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?client (COUNT(DISTINCT ?person) AS ?people) WHERE { ?a ex:person ?person
    ; ex:project ?p . ?p ex:client ?client } GROUP BY ?client'
explanation: Trace the shared variables between triple patterns. Use the exact output
  names requested and preserve the stated result grain.
hints:
- Start with the entity or output grain requested by the question.
- Trace the shared variables between triple patterns. Use the exact output names requested
  and preserve the stated result grain.
- Use the public dataset to trace one result from its inputs. Then consider missing
  values and repeated matches.
