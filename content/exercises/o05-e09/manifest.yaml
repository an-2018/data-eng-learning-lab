grading:
  kind: sparql
questions:
- id: meaning
  prompt: What does a passing executable check establish?
  options:
  - The stated behavior holds on the tested fixtures.
  - Every possible model is correct.
  - The ontology is complete for the entire world.
  answer: The stated behavior holds on the tested fixtures.
- id: evidence
  prompt: How should an infrastructure error affect mastery?
  options:
  - It should count as a wrong answer.
  - It should not change mastery.
  - It should count as a pass.
  answer: It should not change mastery.
wrong_solutions:
- query.rq: 'PREFIX ex: <https://example.org/>

    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?wrong WHERE { FILTER(false) }'
variant_group: o05
rubric:
- All stated executable requirements pass.
- Explain why the implementation has the intended meaning.
