    @prefix sh: <http://www.w3.org/ns/shacl#> .


    # Write your model here.

    '
solution:
  shapes.ttl: '@prefix ex: <https://example.org/> .

    @prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .

    @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .

    @prefix owl: <http://www.w3.org/2002/07/owl#> .

    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

    @prefix sh: <http://www.w3.org/ns/shacl#> .

    ex:PersonShape a sh:NodeShape ; sh:targetClass ex:Person ; sh:property [ sh:path
    ex:employeeId ; sh:minCount 1 ; sh:maxCount 1 ; sh:datatype xsd:string ], [ sh:path
    ex:worksFor ; sh:minCount 1 ; sh:class ex:Company ] .'
explanation: Select Person focus nodes, follow the stated property path, and constrain
  its value nodes. Cardinality and value type are independent requirements.
hints:
- Start with the entity or output grain requested by the question.
- Select Person focus nodes, follow the stated property path, and constrain its value
  nodes. Cardinality and value type are independent requirements.
- Use the public dataset to trace one result from its inputs. Then consider missing
  values and repeated matches.
