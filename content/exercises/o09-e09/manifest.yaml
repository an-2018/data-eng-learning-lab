statement: 'Require exactly one string employeeId and at least one Company-valued
  worksFor.


  Use sh:targetClass ex:Person. Validation uses the explicit data graph with no OWL
  materialization.'
requirements:
- Implement the behavior described above for every fixture.
- Use the exact output variable names or file contract shown in the task.
- Preserve identity, datatypes, and duplicate rows unless the task explicitly requests
  a change.
